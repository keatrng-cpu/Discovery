# Forge Atlas Wave 1 H13: minimal CI. Install + existing tests only. No secrets, no deploy.
name: ci
on:
  pull_request:
    branches: [claude/blissful-darwin-uaoi7e]
  push:
    branches: [claude/blissful-darwin-uaoi7e]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install pytest
      - name: Test
        run: python -m pytest -q desk/tests
